<!DOCTYPE html><html><head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="A production-ready Sourcya Flutter application for mobile and web.">
    <meta name="theme-color" content="#14213D">
    <meta name="color-scheme" content="light dark">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sourcya">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preload" href="icons/Icon-192.png" as="image">
    <link rel="stylesheet" href="loader_styles.css">

    <title>Sourcya</title>
    <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #14213D;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #14213D;
          }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
  <body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
    <div id="app-loader" role="status" aria-live="polite" aria-busy="true">
      <div class="loader-glow loader-glow-start" aria-hidden="true"></div>
      <div class="loader-glow loader-glow-end" aria-hidden="true"></div>

      <main class="loader-content">
        <section id="loader-hero" class="loader-hero" aria-label="Sourcya application loading">
          <div class="loader-logo-shell">
            <img class="loader-logo" src="icons/Icon-192.png" alt="Sourcya">
          </div>
          <div class="loader-copy">
            <p class="loader-eyebrow">SOURCYA</p>
            <h1 id="loader-title">Your workspace is almost ready</h1>
            <p id="loading-status">Preparing the application…</p>
          </div>
          <div class="loader-progress" aria-hidden="true">
            <span></span>
          </div>
        </section>
      </main>

      <footer id="loader-footer">Flutter · Android · iOS · Web</footer>
    </div>

    <noscript>
      <div class="no-script-message">
        JavaScript is required to run this application. Please enable JavaScript in your browser and reload the page.
      </div>
    </noscript>

    <script>
      (() => {
      const loaderMessages = {
        en: {
          title: 'Your workspace is almost ready',
          heroLabel: 'Sourcya application loading',
          preparing: 'Preparing the application…',
          starting: 'Starting the application…',
          ready: 'Opening your workspace…',
          failed: 'The application could not start. Please refresh and try again.',
          footer: 'Flutter · Android · iOS · Web'
        },
        ar: {
          title: 'مساحة عملك أوشكت على الجاهزية',
          heroLabel: 'جارٍ تحميل تطبيق سورسيا',
          preparing: 'جارٍ تجهيز التطبيق…',
          starting: 'جارٍ تشغيل التطبيق…',
          ready: 'جارٍ فتح مساحة العمل…',
          failed: 'تعذر تشغيل التطبيق. يُرجى تحديث الصفحة والمحاولة مرة أخرى.',
          footer: 'Flutter · أندرويد · iOS · الويب'
        }
      };

      const language = (navigator.language || 'en').split('-')[0];
      const messages = loaderMessages[language] || loaderMessages.en;
      const isRtl = language === 'ar';
      const loader = document.getElementById('app-loader');
      const loaderHero = document.getElementById('loader-hero');
      const loaderTitle = document.getElementById('loader-title');
      const loadingStatus = document.getElementById('loading-status');
      const loaderFooter = document.getElementById('loader-footer');

      document.documentElement.lang = language;
      document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
      loaderHero.setAttribute('aria-label', messages.heroLabel);
      loaderTitle.textContent = messages.title;
      loadingStatus.textContent = messages.preparing;
      loaderFooter.textContent = messages.footer;

      function updateLoaderStatus(message) {
        loadingStatus.textContent = message;
      }

      function dismissLoader() {
        if (!loader) return;
        loader.setAttribute('aria-busy', 'false');
        loader.classList.add('loader-hidden');
        window.setTimeout(() => loader.remove(), 360);
      }

      function showLoaderError(error) {
        console.error('Flutter bootstrap failed', error);
        if (!loader) return;
        loader.classList.add('loader-error');
        loader.setAttribute('aria-busy', 'false');
        updateLoaderStatus(messages.failed);
      }

      {{flutter_js}}
      {{flutter_build_config}}

      _flutter.loader.load({
        onEntrypointLoaded: async function (engineInitializer) {
          try {
            updateLoaderStatus(messages.starting);
            const appRunner = await engineInitializer.initializeEngine();
            updateLoaderStatus(messages.ready);
            await appRunner.runApp();
            dismissLoader();
          } catch (error) {
            showLoaderError(error);
            throw error;
          }
        }
      });
      })();
    </script>
  

</body></html>
