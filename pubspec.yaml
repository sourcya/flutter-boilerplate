name: flutter_boilerplate
version: 0.0.1+1
publish_to: none
description: A new Sourcya Flutter project.
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  playx: ^1.5.0
  playx_version_update: ^1.0.0
  dots_indicator: ^4.0.1
  pinput: ^5.0.1
  flutter_keyboard_visibility: ^6.0.0
  path_provider: ^2.1.5
  path: ^1.9.1
  sentry_dio: ^9.5.0
  dropdown_button2: ^2.3.9
  flutter_advanced_drawer: ^1.5.0
  data_table_2: ^2.7.2
  flutter_native_splash: ^2.4.6
  package_info_plus: ^9.0.0
  infinite_scroll_pagination:
    git:
      url: https://github.com/basemosama/infinite_scroll_pagination.git
      ref: fix-paging-controller-refresh
  flutter_staggered_grid_view: ^0.7.0
  grouped_list: ^6.0.0
  sliver_tools: ^0.2.12
  pointer_interceptor: ^0.10.1+2
  pretty_qr_code: ^3.6.0
  flutter_speed_dial: ^7.0.0
  url_launcher: ^6.3.2





dev_dependencies:
  build_runner: ^2.5.0
  flutter_test:
    sdk: flutter
  lint: ^2.8.0
  package_rename: ^1.10.0
  flutter_launcher_icons: ^0.14.4
  flutter_project_name_changer: ^1.0.5


scripts:
  setup:
    $before: echo Setting up project...
    $script:
      flutter pub get &&
      dart run package_rename &&
      flutter pub run flutter_project_name_changer:main sourcya &&
      flutter pub run flutter_launcher_icons
      && dart run scripts/generate_keystore.dart
    $after: echo Project setup complete.


package_rename_config:
  android:
    app_name: Sourcya
    package_name: io.sourcya.app
  ios:
    app_name: Sourcya
    bundle_name: sonbol
    package_name: io.sourcya.app
  web:
    app_name: Sourcya
    description: Sourcya App.


flutter_launcher_icons:
  image_path_android: "assets/images/logo.png"
  image_path_ios: "assets/images/logo.png"
  android: "ic_launcher"
  ios: true
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"  # only available for Android 8.0 devices and above
  adaptive_icon_foreground: "assets/images/logo.png" # only available for Android 8.0 devices and above
  adaptive_icon_monochrome: "assets/images/logo.png" # only available for Android 13 devices and above
  image_path_ios_dark_transparent: "assets/images/logo.png"
  image_path_ios_tinted_grayscale: "assets/images/logo.png"
  desaturate_tinted_to_grayscale_ios: true
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"



flutter:
  uses-material-design: true
  fonts:
    - family: Segoe
      fonts:
        - asset: assets/fonts/segoe/Segoe-Bold.ttf
          weight: 700
        - asset: assets/fonts/segoe/Segoe-Medium.ttf
          weight: 500
        - asset: assets/fonts/segoe/Segoe-Regular.ttf
          weight: 400
        - asset: assets/fonts/segoe/Segoe-Light.ttf
          weight: 300

    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-Black.ttf
          weight: 900
        - asset: assets/fonts/cairo/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/cairo/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/cairo/Cairo-ExtraLight.ttf
          weight: 200

  assets:
    - assets/
    - assets/animation/
    - assets/images/
    - assets/images/icons/
    - assets/translations/
    - assets/fonts/
    - assets/env/
    - assets/fonts/cairo/
    - assets/fonts/segoe/
    - assets/icons/

flutter_native_splash:
  color: "#14213D"
  color_dark: "#14213D"
  image: assets/images/logo.png
  android_12:
    color: "#14213D"
    color_dark: "#14213D"
    image: assets/images/logo.png
    icon_background_color: "#14213D"
    icon_background_color_dark: "#14213D"
  web: true
  ios: true
  android: true