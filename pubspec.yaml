name: flutter_boilerplate
version: 0.0.1+1
publish_to: none
description: A new Sourcya Flutter project.
environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  data_table_2: ^2.7.2
  dots_indicator: ^4.0.1
  dropdown_button2: ^3.1.0
  flutter:
    sdk: flutter
  flutter_advanced_drawer: ^1.5.0
  flutter_native_splash: ^2.4.7
  flutter_speed_dial: ^7.0.0
  flutter_staggered_grid_view: ^0.7.0
  grouped_list: ^6.0.0
  infinite_scroll_pagination:
    git:
      url: https://github.com/basemosama/infinite_scroll_pagination.git
      ref: fix-paging-controller-refresh
  path: ^1.9.1
  path_provider: ^2.1.5
  pinput: ^5.0.1
  playx: ^2.1.2
  playx_version_update: ^1.3.0
  pointer_interceptor: ^0.10.1+3
  pretty_qr_code: ^3.6.0
  sliver_tools: ^0.2.12
  url_launcher: ^6.3.2
  web: ^1.1.1

dependency_overrides:
  # playx_network 1.0.0 does not yet handle Dio 5.10+'s transformTimeout case.
  dio: 5.9.2

dev_dependencies:
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_project_name_changer: ^1.0.5
  flutter_test:
    sdk: flutter
  lint: ^2.8.0
  package_rename: ^1.10.1
  rps:

# Project scripts, powered by the `rps` dev dependency (no global install needed).
# Run any script below with: dart run rps <script-name>
# Example: dart run rps setup
scripts:
  # Renames the package/app, regenerates launcher icons, and creates a debug keystore.
  # Run once when starting a new project from this boilerplate.
  setup:
    $before: echo Setting up project...
    $script: >-
      flutter pub get &&
      dart run package_rename --path="package_rename_config.yaml" &&
      flutter pub run flutter_project_name_changer:main sourcya &&
      dart run flutter_launcher_icons &&
      dart run flutter_native_splash:create &&
      dart run scripts/generate_keystore.dart
    $after: echo Project setup complete.
  # Runs `flutter analyze` over the project.
  analyze:
    $script: flutter analyze
  # Builds the release web bundle (see README > Web build and deployment).
  build-web:
    $script: flutter build web --release
  # Runs `flutter clean`.
  clean:
    $script: flutter clean
  # Formats all Dart files with `dart format`.
  format:
    $script: dart format .
  # Runs build_runner once to (re)generate code (e.g. asset/model generators).
  gen:
    $script: dart run build_runner build --delete-conflicting-outputs
  # Regenerates launcher icons from `flutter_launcher_icons.yaml` after changing the logo.
  icons:
    $script: dart run flutter_launcher_icons
  # Applies `package_rename_config.yaml` (app name, bundle/package id) to android/ios/web.
  rename:
    $script: dart run package_rename --path="package_rename_config.yaml"
  # Regenerates native splash screens from the `flutter_native_splash` config below
  # after changing the logo or splash colors.
  splash:
    $script: dart run flutter_native_splash:create
  # Runs `flutter test` if a test/ directory exists, otherwise skips.
  test:
    $script: >-
      if [ -d test ]; then flutter test; else echo "No test directory; skipping."; fi
  # Watches for file changes and re-runs build_runner incrementally.
  watch:
    $script: dart run build_runner watch --delete-conflicting-outputs

flutter:
  uses-material-design: true
  fonts:
    - family: Segoe
      fonts:
        - asset: assets/fonts/segoe/Segoe-Bold.ttf
          weight: 700
        - asset: assets/fonts/segoe/Segoe-Medium.ttf
          weight: 500
        - asset: assets/fonts/segoe/Segoe-Regular.ttf
          weight: 400
        - asset: assets/fonts/segoe/Segoe-Light.ttf
          weight: 300

    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-Black.ttf
          weight: 900
        - asset: assets/fonts/cairo/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/cairo/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/cairo/Cairo-ExtraLight.ttf
          weight: 200

  assets:
    - assets/
    - assets/animation/
    - assets/images/
    - assets/images/icons/
    - assets/images/logo/
    - assets/translations/
    - assets/fonts/
    - assets/env/
    - assets/fonts/cairo/
    - assets/fonts/segoe/

# Regenerate with: dart run rps splash (after changing the logo or colors below).
# Web is intentionally excluded: web/index.html already ships its own bespoke,
# translated (en/ar) loading screen, so a native splash there would just be a
# redundant, never-dismissed overlay underneath it.
flutter_native_splash:
  color: "#14213D"
  color_dark: "#14213D"
  image: assets/images/logo.png
  android_12:
    color: "#14213D"
    color_dark: "#14213D"
    image: assets/images/logo.png
    icon_background_color: "#14213D"
    icon_background_color_dark: "#14213D"
  web: false
  ios: true
  android: true
