<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sourcya Flutter Boilerplate — Docs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
    <meta name="description" content="Architecture, conventions, and skills reference for the Sourcya Flutter boilerplate." />
    <link rel="icon" type="image/png" href="../icons/Icon-192.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
    <style>
      :root {
        --theme-color: #14213d;
      }
      nav.app-nav li ul {
        min-width: 100px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.$docsify = {
        name: "Sourcya Flutter Boilerplate",
        repo: "",

        loadNavbar: true,
        subMaxLevel: 3,
        auto2top: true,
        homepage: "README.md",
        themeColor: "#14213D",
        search: {
          maxAge: 86400000,

          depth: 4,

        copyCode: {
          buttonText: "Copy",
          errorText: "Error",
          successText: "Copied",
        },
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
